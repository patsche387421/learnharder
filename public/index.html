<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnHarder — Wird aktualisiert</title>
  <meta name="description" content="LearnHarder wird gerade auf eine neue, bessere Version aktualisiert. Bald sind wir zurück!">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-500: #A855F7;
      --purple-600: #9333EA;
      --purple-700: #7C3AED;
      --indigo: #4F46E5;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-muted: #475569;
      --text-subtle: #94A3B8;
      --border: #E2E8F0;
      --brand-muted: #EDE9FE;
    }

    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Animated gradient background orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      z-index: 0;
      animation: float 12s ease-in-out infinite;
    }
    body::before {
      width: 500px;
      height: 500px;
      background: var(--purple-500);
      top: -150px;
      right: -100px;
    }
    body::after {
      width: 400px;
      height: 400px;
      background: var(--indigo);
      bottom: -100px;
      left: -80px;
      animation-delay: -6s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.03);
    }

    /* Logo / Icon */
    .logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, var(--purple-700), var(--indigo));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(124,58,237,0.25);
    }
    .logo-icon svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--purple-700), var(--indigo));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .description {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    /* Progress indicator */
    .progress-wrap {
      margin-bottom: 28px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 6px;
      background: var(--brand-muted);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, var(--purple-700), var(--indigo));
      border-radius: 999px;
      animation: pulse-progress 2s ease-in-out infinite;
    }
    @keyframes pulse-progress {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Feature chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--purple-700);
      background: var(--brand-muted);
      border-radius: 999px;
      border: 1px solid rgba(124,58,237,0.1);
    }
    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--purple-600);
    }

    .footer-text {
      font-size: 12px;
      color: var(--text-subtle);
      letter-spacing: 0.5px;
    }
    .footer-text a {
      color: var(--purple-700);
      text-decoration: none;
      font-weight: 500;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
        border-radius: 20px;
      }
      h1 { font-size: 24px; }
      .subtitle { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>

    <h1>LearnHarder</h1>
    <p class="subtitle">Wird gerade aktualisiert</p>

    <p class="description">
      Wir arbeiten an einer komplett neuen Version von LearnHarder
      mit einem frischen Design, neuen Features und einer deutlich besseren Lernerfahrung.
    </p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Migration läuft</span>
        <span>Phase 1 / 3</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="chips">
      <span class="chip"><span class="chip-dot"></span>Neues Design</span>
      <span class="chip"><span class="chip-dot"></span>Mobile PWA</span>
      <span class="chip"><span class="chip-dot"></span>Brainpower-System</span>
      <span class="chip"><span class="chip-dot"></span>Ranglisten</span>
    </div>

    <p class="footer-text">
      © 2026 LearnHarder · <a href="mailto:info@learnharder.app">Kontakt</a>
    </p>
  </div>
</body>
</html>
