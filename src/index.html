<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Login</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-login">
  <main class="auth-card">
    <h1>LernHub</h1>
    <p class="subtitle">Bitte melde dich an</p>

    <form id="login-form" autocomplete="off">
      <label>
        E-Mail
        <input type="email" id="email" name="email" required />
      </label>
      <label>
        Passwort
        <input type="password" id="password" name="password" required />
      </label>
      <button type="submit">Anmelden</button>
      <p id="login-error" class="error" hidden>E-Mail oder Passwort falsch.</p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      // Bereits eingeloggt → direkt zum Dashboard
      const { data: { session } } = await SupabaseClient.client.auth.getSession();
      if (session) { location.href = "/dashboard.html"; return; }

      const form    = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const pass  = document.getElementById("password").value;

        if (await Auth.login(email, pass)) {
          location.href = "/dashboard.html";
        } else {
          errorEl.hidden = false;
        }
      });
    })();
  </script>

  <footer class="site-footer">
    <span>LernHub</span>
    <span class="footer-sep">·</span>
    <span>HTL Demo</span>
  </footer>
</body>
</html>
