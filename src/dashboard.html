<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Dashboard</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-dashboard">

  <header class="topbar">
    <span class="brand">LernHub</span>
    <div class="topbar-right">
      <span id="welcome-name"></span>
      <button id="logout" class="btn-ghost">Abmelden</button>
    </div>
  </header>

  <main class="db-layout">

    <!-- Hero-Begrüßung -->
    <section class="db-hero">
      <div class="db-hero-text">
        <p class="db-eyebrow">Willkommen zurück</p>
        <h1 class="db-headline" id="db-greeting">Hey!</h1>
        <p class="db-sub">Bereit weiterzulernen?</p>
      </div>
      <a href="/faecher.html" class="btn-cta">
        Zu den Fächern <span class="btn-arrow">→</span>
      </a>
    </section>

    <!-- Stats-Reihe (Platzhalter – später per DB befüllt) -->
    <section class="db-stats">
      <div class="stat-card">
        <span class="stat-icon">📚</span>
        <span class="stat-value" id="stat-themen">–</span>
        <span class="stat-label">Themen bearbeitet</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🎯</span>
        <span class="stat-value" id="stat-quiz">–</span>
        <span class="stat-label">Quiz-Punkte</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🔥</span>
        <span class="stat-value" id="stat-streak">–</span>
        <span class="stat-label">Lerntage in Folge</span>
      </div>
    </section>

    <!-- Letzte Aktivität (Platzhalter) -->
    <section class="db-recent">
      <h2 class="db-section-title">Zuletzt gelernt</h2>
      <div class="db-recent-empty">
        <span class="db-recent-icon">🗂</span>
        <p>Noch keine Aktivität – leg jetzt los!</p>
        <a href="/faecher.html" class="btn-ghost-sm">Fächer ansehen</a>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stats.js"></script>
  <script>
    (async () => {
      await Auth.requireLogin();

      const name = Auth.displayName();
      document.getElementById("welcome-name").textContent = name;
      document.getElementById("db-greeting").textContent  = "Hey, " + name + "!";

      document.getElementById("logout").addEventListener("click", () => Auth.logout());

      // Echte Gesamt-Stats aus DB laden und anzeigen
      const dbStats = await Stats.ladeDashboardStats();
      document.getElementById("stat-themen").textContent =
        dbStats.themenBearbeitet > 0 ? dbStats.themenBearbeitet : "–";
      document.getElementById("stat-quiz").textContent =
        dbStats.quizPunkte > 0 ? dbStats.quizPunkte : "–";
    })();
  </script>

  <footer class="site-footer">
    <span>LernHub</span>
    <span class="footer-sep">·</span>
    <span>HTL Demo</span>
    <span class="footer-sep">·</span>
    <a href="/faecher.html" class="footer-link">Fächer</a>
  </footer>

</body>
</html>
