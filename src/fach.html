<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Fach</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-fach" data-page-title="Thema">
  <header class="topbar">
    <div class="topbar-links">
      <div class="logo-placeholder"></div>
      <span class="topbar-seitenname" id="topbar-seitenname"></span>
    </div>

    <div class="topbar-level-mitte">
      <span class="topbar-level-label">⭐ Level <span id="topbar-level-zahl">–</span></span>
      <div class="topbar-level-bar-wrap">
        <div id="topbar-level-fill" style="width: 0%"></div>
      </div>
      <span class="topbar-level-ep" id="topbar-level-ep">–</span>
    </div>

    <div class="topbar-right">
      <span id="topbar-energy" class="topbar-icon" data-tooltip="Energie">🥤 –</span>
      <span id="topbar-trophies" class="topbar-icon" data-tooltip="Trophäen">🏆 <span id="topbar-trophies-count">–</span></span>
      <a href="/profil.html" class="topbar-nav-link">PROFIL</a>
      <a href="#" class="topbar-nav-link" title="Kommt bald">HILFE</a>
    </div>
  </header>

  <!-- Standard-Fach: Theorie + Quiz -->
  <main class="container" id="main-fach">
    <h1 id="fach-title">Fach</h1>

    <nav class="tabs">
      <button class="tab active" data-tab="theorie">Theorie</button>
      <button class="tab" data-tab="quiz">Aufgaben</button>
      <button class="tab" data-tab="modi">Modi</button>
    </nav>

    <section id="tab-theorie" class="tab-panel">
      <div id="theorie"></div>
    </section>

    <section id="tab-quiz" class="tab-panel" hidden>
      <form id="quiz"></form>
      <button id="quiz-submit" class="btn-primary">Auswerten</button>
      <p id="quiz-result" class="quiz-result" hidden></p>
    </section>

    <section id="tab-modi" class="tab-panel" hidden>
      <div class="modi-placeholder">
        <p>Kommt bald: Karteikarten, Wahr/Falsch, Speedmodus</p>
      </div>
    </section>
  </main>

  <!-- Tool-Modus: Platzhalter für eigenständige Tool-Module (z.B. DSTool) -->
  <main class="container-tool" id="main-tool" hidden>
    <div id="tool-root"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      // Seitentitel aus Query-Param setzen bevor renderTopbar aufgerufen wird
      const fachId = new URLSearchParams(location.search).get("fach") || "";
      document.body.dataset.pageTitle = (fachId.split('-')[0] || 'Thema').toUpperCase();

      await Auth.requireLogin();
      await Level.renderTopbar();

      App.renderFach(fachId);
    })();
  </script>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© LernHub 2026</span>
      <nav>
        <a href="/impressum.html">Impressum</a>
        <a href="/datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>
</body>
</html>
