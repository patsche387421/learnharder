<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Fach</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-fach">
  <header class="topbar">
    <a href="/dashboard.html" class="brand">LernHub</a>

    <a href="/profil.html" class="topbar-level-mitte topbar-icon" data-tooltip="Profil ansehen">
      <span class="topbar-level-label">⭐ Level <span id="topbar-level-zahl">1</span></span>
      <div class="topbar-level-bar-wrap">
        <div id="topbar-level-fill" style="width: 0%"></div>
      </div>
      <span id="topbar-level-ep" class="topbar-level-ep">0 / 100 EP</span>
    </a>

    <div class="topbar-right">
      <span id="topbar-energy" class="topbar-icon" data-tooltip="Energydrinks">🥤 5</span>
      <a href="/tauschen.html" id="topbar-trophies" class="topbar-icon" data-tooltip="Trophäen">🏆 <span id="topbar-trophies-count">0</span></a>
      <span id="welcome-name"></span>
      <button id="logout" class="btn-ghost">Abmelden</button>
    </div>
  </header>

  <!-- Standard-Fach: Theorie + Quiz -->
  <main class="container" id="main-fach">
    <h1 id="fach-title">Fach</h1>

    <nav class="tabs">
      <button class="tab active" data-tab="theorie">Theorie</button>
      <button class="tab" data-tab="quiz">Quiz</button>
    </nav>

    <section id="tab-theorie" class="tab-panel">
      <div id="theorie"></div>
    </section>

    <section id="tab-quiz" class="tab-panel" hidden>
      <form id="quiz"></form>
      <button id="quiz-submit" class="btn-primary">Auswerten</button>
      <p id="quiz-result" class="quiz-result" hidden></p>
    </section>
  </main>

  <!-- Tool-Modus: Platzhalter für eigenständige Tool-Module (z.B. DSTool) -->
  <main class="container-tool" id="main-tool" hidden>
    <div id="tool-root"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await Auth.requireLogin();
      await Level.renderTopbar();

      // Tab-Umschaltung (nur im Standard-Fach-Modus aktiv)
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const tab = btn.dataset.tab;
          document.getElementById("tab-theorie").hidden = tab !== "theorie";
          document.getElementById("tab-quiz").hidden = tab !== "quiz";
        });
      });

      const fachId = new URLSearchParams(location.search).get("fach") || "";
      App.renderFach(fachId);
    })();
  </script>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© LernHub 2026</span>
      <nav>
        <a href="/impressum.html">Impressum</a>
        <a href="/datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>
</body>
</html>
