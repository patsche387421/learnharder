<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Profil</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-profil">

  <header class="topbar">
    <a href="/dashboard.html" class="brand">LernHub</a>

    <a href="/profil.html" class="topbar-mitte">Mein Profil</a>

    <div class="topbar-right">
      <span id="welcome-name"></span>
      <a href="#" class="topbar-hilfe" title="Kommt bald">Hilfe</a>
    </div>
  </header>

  <main class="container">
    <h1>Mein Profil</h1>
    <p class="page-sub" id="profil-username"></p>

    <!-- Section 1: Globaler Stand -->
    <section class="profil-section">
      <h2 class="profil-section-title">⭐ Globaler Stand</h2>
      <div class="profil-global-card">
        <div class="profil-level-row">
          <span class="profil-level-badge">Level <span id="profil-level">1</span></span>
          <span class="profil-ep-text" id="profil-ep-text">0 / 100 EP</span>
        </div>
        <div class="profil-bar-wrap">
          <div class="profil-bar-fill" id="profil-bar-fill" style="width: 0%"></div>
        </div>
        <div class="profil-global-stats">
          <div class="profil-stat">
            <span class="profil-stat-icon">💎</span>
            <span class="profil-stat-wert" id="profil-total-xp">0</span>
            <span class="profil-stat-label">Gesamt-EP</span>
          </div>
          <div class="profil-stat">
            <span class="profil-stat-icon">🏆</span>
            <span class="profil-stat-wert" id="profil-trophies">0</span>
            <span class="profil-stat-label">Trophäen</span>
          </div>
          <div class="profil-stat">
            <span class="profil-stat-icon">🥤</span>
            <span class="profil-stat-wert" id="profil-energy">5</span>
            <span class="profil-stat-label">Energie</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 2: Fächer-Übersicht -->
    <section class="profil-section">
      <h2 class="profil-section-title">📚 Fächer-Übersicht</h2>
      <div class="profil-faecher" id="profil-faecher">
        <p class="profil-lade-text">Lade Fächer …</p>
      </div>
    </section>

    <!-- Section 3: Level-Verlauf -->
    <section class="profil-section">
      <h2 class="profil-section-title">📈 Level-Verlauf</h2>
      <div class="profil-grafik-wrap">
        <svg id="level-grafik" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" aria-label="Level-Verlauf Diagramm"></svg>
        <p class="profil-grafik-hinweis">Die Grafik füllt sich mit der Zeit, je mehr Tages-Quizzes du spielst.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© LernHub 2026</span>
      <nav>
        <a href="/impressum.html">Impressum</a>
        <a href="/datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/level.js"></script>
  <script>
    // TODO: level_log Tabelle einführen,
    // um historischen Verlauf zu speichern

    function renderLevelGrafik(datenpunkte) {
      const svg = document.getElementById('level-grafik');
      const PAD_L = 45, PAD_R = 20, PAD_T = 15, PAD_B = 35;
      const W = 600, H = 200;
      const plotW = W - PAD_L - PAD_R;
      const plotH = H - PAD_T - PAD_B;
      const MIN_LVL = 1, MAX_LVL = 10;

      const xOf = (i, n) => PAD_L + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
      const yOf = (l) => PAD_T + plotH - ((l - MIN_LVL) / (MAX_LVL - MIN_LVL)) * plotH;

      let h = '';

      // Horizontale Grid-Linien + Y-Achsen-Beschriftung
      for (let l = 1; l <= 10; l += 3) {
        const y = yOf(l);
        h += `<line x1="${PAD_L}" y1="${y}" x2="${W - PAD_R}" y2="${y}" stroke="var(--surface-2)" stroke-width="1"/>`;
        h += `<text x="${PAD_L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${l}</text>`;
      }

      // Achsen
      h += `<line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${H - PAD_B}" stroke="var(--text-muted)" stroke-width="1"/>`;
      h += `<line x1="${PAD_L}" y1="${H - PAD_B}" x2="${W - PAD_R}" y2="${H - PAD_B}" stroke="var(--text-muted)" stroke-width="1"/>`;

      // Linie bei mehreren Punkten
      if (datenpunkte.length > 1) {
        const pts = datenpunkte.map((d, i) => `${xOf(i, datenpunkte.length)},${yOf(d.level)}`).join(' ');
        h += `<polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>`;
      }

      // Datenpunkte + X-Beschriftung
      datenpunkte.forEach((d, i) => {
        const x = xOf(i, datenpunkte.length);
        const y = yOf(d.level);
        const label = d.tag
          ? d.tag.toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit' })
          : 'Heute';
        h += `<circle cx="${x}" cy="${y}" r="6" fill="var(--primary)"/>`;
        h += `<text x="${x}" y="${H - PAD_B + 18}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${label}</text>`;
      });

      svg.innerHTML = h;
    }

    function renderFachZeile(fach, fachStats) {
      const naechste = Level.LEVEL_THRESHOLDS[fachStats.fachLevel] ?? null;
      const prozent  = naechste ? Math.min(fachStats.fachXp / naechste * 100, 100) : 100;

      const row = document.createElement('div');
      row.className = 'profil-fach-row';
      row.innerHTML = `
        <span class="profil-fach-name">${fach.icon} <span>${fach.name}</span></span>
        <span class="profil-fach-level">Level ${fachStats.fachLevel}</span>
        <div class="profil-fach-bar-wrap">
          <div class="profil-fach-bar-fill" style="width: ${prozent}%"></div>
        </div>
        <span class="profil-fach-antworten">✅ ${fachStats.correctAnswers}</span>
      `;
      return row;
    }

    (async () => {
      await Auth.requireLogin();

      const [userStats, manifest] = await Promise.all([
        Level.getUserStats(),
        fetch('/assets/data/manifest.json').then(r => r.json())
      ]);

      await Level.renderTopbar(userStats);

      // Benutzername
      const { data: sessionData } = await sb.auth.getSession();
      const email = sessionData.session?.user?.email ?? '';
      document.getElementById('profil-username').textContent = email;

      // Section 1 befüllen
      const naechste = Level.LEVEL_THRESHOLDS[userStats.level] ?? null;
      const prozent  = naechste ? Math.min(userStats.totalXp / naechste * 100, 100) : 100;

      document.getElementById('profil-level').textContent    = userStats.level;
      document.getElementById('profil-ep-text').textContent  = userStats.totalXp + ' / ' + (naechste ?? '–') + ' EP';
      document.getElementById('profil-bar-fill').style.width = prozent + '%';
      document.getElementById('profil-total-xp').textContent = userStats.totalXp;
      document.getElementById('profil-trophies').textContent = userStats.trophies;
      document.getElementById('profil-energy').textContent   = userStats.energy;

      // Section 2: Fächer parallel laden
      const faecher = manifest.faecher;
      const fachStatsList = await Promise.all(faecher.map(f => Stats.ladeFachStatsKomplett(f.id)));

      const container = document.getElementById('profil-faecher');
      container.innerHTML = '';
      faecher.forEach((fach, i) => {
        container.appendChild(renderFachZeile(fach, fachStatsList[i]));
      });

      // Section 3: Grafik mit aktuellem Level als einzigem Punkt
      renderLevelGrafik([{ tag: null, level: userStats.level }]);
    })();
  </script>

</body>
</html>
