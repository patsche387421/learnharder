<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posArrayCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="posArrayCellTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="posArrayHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="posArrayGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="74" rx="34" ry="4.6" fill="#5B21B6" opacity="0.26"/>

  <!-- Connector bar -->
  <rect x="14" y="44" width="68" height="6" rx="3" fill="#5B21B6" opacity="0.55"/>

  <!-- Cell 1 -->
  <g>
    <rect x="14" y="38" width="17" height="17" rx="4" fill="url(#posArrayCellTop)"/>
    <rect x="15" y="42" width="17" height="17" rx="4" fill="url(#posArrayCell)"/>
    <rect x="15" y="42" width="17" height="5" rx="2.5" fill="#FFFFFF" opacity="0.12"/>
  </g>
  <!-- Cell 2 -->
  <g>
    <rect x="35" y="38" width="17" height="17" rx="4" fill="url(#posArrayCellTop)"/>
    <rect x="36" y="42" width="17" height="17" rx="4" fill="url(#posArrayCell)"/>
    <rect x="36" y="42" width="17" height="5" rx="2.5" fill="#FFFFFF" opacity="0.12"/>
  </g>
  <!-- Cell 3 — highlighted index -->
  <g filter="url(#posArrayGlow)">
    <rect x="56" y="34" width="19" height="19" rx="4.5" fill="#E879F9" opacity="0.55"/>
    <rect x="57" y="38" width="19" height="19" rx="4.5" fill="url(#posArrayHi)"/>
    <rect x="57" y="38" width="19" height="6" rx="3" fill="#FFFFFF" opacity="0.22"/>
  </g>

  <!-- Index labels -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="23.5" y="56.5" font-size="9" fill="#C4B5FD">0</text>
    <text x="44.5" y="56.5" font-size="9" fill="#C4B5FD">1</text>
    <text x="66.5" y="52.5" font-size="10" fill="#FFFFFF">2</text>
  </g>

  <!-- Index pointer to highlighted cell -->
  <path d="M66.5 26 L62 32 L71 32 Z" fill="url(#posArrayHi)"/>
  <circle cx="66.5" cy="22" r="4.5" fill="#F0ABFC"/>
  <text x="66.5" y="25.4" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="7" fill="#86198F" text-anchor="middle">i</text>

  <!-- Sparkle accents -->
  <circle cx="18" cy="30" r="1.7" fill="#22D3EE" opacity="0.85"/>
  <path d="M84 62 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z" fill="#F0ABFC" opacity="0.9"/>
</svg>