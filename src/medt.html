<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnHarder – MEDT</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-fach-seite" data-page-title="MEDT">

  <header class="topbar" id="topbar"></header>

  <main class="container">
    <div id="fach-header" class="fach-seite-header"></div>
    <div id="fach-stats" class="fach-stats-bar"></div>
    <div class="fach-level-leiste">
      <div class="fach-level-info">
        <span>Fach-Level <strong id="fach-level">1</strong></span>
        <span id="fach-xp-text">0 / 100 EP</span>
      </div>
      <div class="fach-level-bar">
        <div id="fach-level-fill" style="width: 0%"></div>
      </div>
      <small id="fach-correct">0 richtige Antworten gesamt</small>
    </div>
    <h2 class="themen-titel">Themen</h2>
    <div id="themen-grid" class="card-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/content-icons.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await Auth.requireLogin();
      await Layout.renderTopbar();

      await App.renderFachSeite("medt", {
        header: document.getElementById("fach-header"),
        stats:  document.getElementById("fach-stats"),
        grid:   document.getElementById("themen-grid")
      });

      const fachStats = await Stats.ladeFachStatsKomplett("medt");
      const f = Level.berechneFortschritt(fachStats.fachXp);
      document.getElementById("fach-level").textContent = f.level;
      document.getElementById("fach-xp-text").textContent = f.epText;
      document.getElementById("fach-level-fill").style.width = f.prozent + "%";
      document.getElementById("fach-correct").textContent = fachStats.correctAnswers + " richtige Antworten gesamt";
    })();
  </script>

  <footer class="site-footer" id="site-footer"></footer>

</body>
</html>
