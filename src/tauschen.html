<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnHarder – Trophäen tauschen</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-tauschen" data-page-title="Tauschen">

  <header class="topbar" id="topbar"></header>

  <main class="container">
    <h1>Trophäen tauschen</h1>
    <p class="page-sub">Tausche gesammelte Trophäen gegen Energydrinks.</p>

    <div class="tausch-card">
      <div class="tausch-werte">
        <div class="tausch-wert">
          <span class="tausch-icon" data-icon="trophy" data-icon-size="40"></span>
          <span class="tausch-zahl" id="tausch-trophies">–</span>
          <span class="tausch-label">Trophäen</span>
        </div>
        <div class="tausch-pfeil">→</div>
        <div class="tausch-wert">
          <span class="tausch-icon" data-icon="energy" data-icon-size="40"></span>
          <span class="tausch-zahl" id="tausch-energie">–</span>
          <span class="tausch-label">Energydrinks</span>
        </div>
      </div>

      <div class="tausch-kurs">
        <strong>50 <span data-icon="trophy" data-icon-size="18"></span> = 1 <span data-icon="energy" data-icon-size="18"></span></strong>
      </div>

      <button id="btn-tauschen" class="btn btn--primary" disabled>
        50 <span data-icon="trophy" data-icon-size="18"></span> gegen 1 <span data-icon="energy" data-icon-size="18"></span> tauschen
      </button>

      <p id="tausch-meldung" class="tausch-meldung" hidden></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    async function aktualisiereAnzeige() {
      const stats = await Level.getUserStats();

      // Topbar nach Tausch mit aktuellen Stats neu rendern
      await Layout.renderTopbar(stats);

      document.getElementById("tausch-trophies").textContent = stats.trophies;
      document.getElementById("tausch-energie").textContent  = stats.energy;

      const btn = document.getElementById("btn-tauschen");
      btn.disabled = stats.trophies < 50;
    }

    (async () => {
      await Auth.requireLogin();
      await Layout.renderTopbar();

      await aktualisiereAnzeige();

      document.getElementById("btn-tauschen").addEventListener("click", async () => {
        const meldung = document.getElementById("tausch-meldung");
        meldung.hidden = true;

        const ergebnis = await Level.tauscheTrophäen(1);

        meldung.hidden = false;
        if (ergebnis.erfolg) {
          meldung.innerHTML = Icons.render('check');
          meldung.insertAdjacentText('beforeend', ' Tausch erfolgreich! +1 Energydrink erhalten.');
          meldung.className   = "tausch-meldung tausch-erfolg";
        } else {
          meldung.innerHTML = Icons.render('xMark');
          meldung.insertAdjacentText('beforeend', ' ' + ergebnis.fehler);
          meldung.className   = "tausch-meldung tausch-fehler";
        }

        await aktualisiereAnzeige();
      });
    })();
  </script>

  <footer class="site-footer" id="site-footer"></footer>

</body>
</html>
