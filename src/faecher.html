<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Fächer</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-faecher">

  <header class="topbar">
    <a href="/dashboard.html" class="brand">LernHub</a>

    <a href="/profil.html" class="topbar-level-mitte topbar-icon" data-tooltip="Profil ansehen">
      <span class="topbar-level-label">⭐ Level <span id="topbar-level-zahl">1</span></span>
      <div class="topbar-level-bar-wrap">
        <div id="topbar-level-fill" style="width: 0%"></div>
      </div>
      <span id="topbar-level-ep" class="topbar-level-ep">0 / 100 EP</span>
    </a>

    <div class="topbar-right">
      <span id="topbar-energy" class="topbar-icon" data-tooltip="Energydrinks">🥤 5</span>
      <a href="/tauschen.html" id="topbar-trophies" class="topbar-icon" data-tooltip="Trophäen">🏆 <span id="topbar-trophies-count">0</span></a>
      <span id="welcome-name"></span>
      <button id="logout" class="btn-ghost">Abmelden</button>
    </div>
  </header>

  <main class="container">
    <h1>Fächer</h1>
    <p class="page-sub">Wähle ein Fach, um Themen zu erkunden.</p>
    <div id="faecher-grid" class="card-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await Auth.requireLogin();
      await Level.renderTopbar();

      App.renderFaecher(document.getElementById("faecher-grid"));
    })();
  </script>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© LernHub 2026</span>
      <nav>
        <a href="/impressum.html">Impressum</a>
        <a href="/datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>

</body>
</html>
