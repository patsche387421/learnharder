<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Fächer</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-faecher">

  <header class="topbar">
    <a href="/dashboard.html" class="brand">← Dashboard</a>
    <div class="topbar-right">
      <span id="welcome-name"></span>
      <button id="logout" class="btn-ghost">Abmelden</button>
    </div>
  </header>

  <main class="container">
    <h1>Fächer</h1>
    <p class="page-sub">Wähle ein Fach, um Themen zu erkunden.</p>
    <div id="faecher-grid" class="card-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await Auth.requireLogin();
      document.getElementById("welcome-name").textContent = Auth.displayName();
      document.getElementById("logout").addEventListener("click", Auth.logout);
      App.renderFaecher(document.getElementById("faecher-grid"));
    })();
  </script>

  <footer class="site-footer">
    <span>LernHub</span>
    <span class="footer-sep">·</span>
    <span>HTL Demo</span>
    <span class="footer-sep">·</span>
    <a href="/dashboard.html" class="footer-link">Dashboard</a>
  </footer>

</body>
</html>
