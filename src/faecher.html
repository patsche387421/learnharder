<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnHarder – Fächer</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-faecher" data-page-title="Fächer">

  <header class="topbar" id="topbar"></header>

  <main class="container">
    <h1>Fächer</h1>
    <p class="page-sub">Wähle ein Fach, um Themen zu erkunden.</p>
    <div id="faecher-grid" class="card-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/content-icons.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await Auth.requireLogin();
      await Layout.renderTopbar();

      App.renderFaecher(document.getElementById("faecher-grid"));
    })();
  </script>

  <footer class="site-footer" id="site-footer"></footer>

</body>
</html>
