<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnHarder – Fach</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-fach" data-page-title="Thema">
  <header class="topbar" id="topbar"></header>

  <!-- Standard-Fach: Theorie + Quiz -->
  <main class="container" id="main-fach">
    <a id="fach-zurueck" class="breadcrumb-back" href="#" hidden></a>
    <h1 id="fach-title">Fach</h1>

    <nav class="tabs">
      <button class="tab active" data-tab="theorie">Theorie</button>
      <button class="tab" data-tab="quiz">Aufgaben</button>
      <button class="tab" data-tab="modi">Modi</button>
    </nav>

    <section id="tab-theorie" class="tab-panel">
      <div id="theorie"></div>
    </section>

    <section id="tab-quiz" class="tab-panel" hidden>
      <form id="quiz"></form>
      <button id="quiz-submit" class="btn btn--primary">Auswerten</button>
      <p id="quiz-result" class="quiz-result" hidden></p>
    </section>

    <section id="tab-modi" class="tab-panel" hidden>
      <div class="modi-placeholder">
        <p>Kommt bald: Karteikarten, Wahr/Falsch, Speedmodus</p>
      </div>
    </section>
  </main>

  <!-- Tool-Modus: Platzhalter für eigenständige Tool-Module (z.B. DSTool) -->
  <main class="container-tool" id="main-tool" hidden>
    <div id="tool-root"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/content-icons.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      // Seitentitel aus Query-Param setzen bevor renderTopbar aufgerufen wird
      const fachId = new URLSearchParams(location.search).get("fach") || "";
      document.body.dataset.pageTitle = (fachId.split('-')[0] || 'Thema').toUpperCase();

      await Auth.requireLogin();
      await Layout.renderTopbar();

      App.renderFach(fachId);
    })();
  </script>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
