<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posIfStem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="posIfNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="posIfTrue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="posIfFalse" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="84" rx="26" ry="4.5" fill="#5B21B6" opacity="0.26"/>

  <!-- Main stem (bottom up to fork) -->
  <path d="M41 82 L41 50 L55 50 L55 82 Z" fill="url(#posIfStem)"/>
  <path d="M41 82 L41 50 L46 50 L46 82 Z" fill="#FFFFFF" opacity="0.12"/>

  <!-- Left branch arm (true) -->
  <path d="M44 54 L24 34 L30 28 L50 48 Z" fill="url(#posIfTrue)"/>
  <!-- Right branch arm (false) -->
  <path d="M52 54 L72 34 L66 28 L46 48 Z" fill="url(#posIfFalse)"/>

  <!-- Decision node (diamond) -->
  <path d="M48 38 L60 50 L48 62 L36 50 Z" fill="url(#posIfNode)"/>
  <path d="M48 38 L60 50 L48 50 Z" fill="#FFFFFF" opacity="0.15"/>

  <!-- Left arrowhead (true) -->
  <path d="M16 26 L34 28 L26 42 Z" fill="url(#posIfTrue)"/>
  <!-- Right arrowhead (false) -->
  <path d="M80 26 L62 28 L70 42 Z" fill="url(#posIfFalse)"/>

  <!-- True / false markers -->
  <circle cx="22" cy="20" r="6" fill="#C4B5FD"/>
  <path d="M19 20 l2 2 4 -4.5" fill="none" stroke="#5B21B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="74" cy="20" r="6" fill="#22D3EE"/>
  <path d="M71.6 17.6 l4.8 4.8 M76.4 17.6 l-4.8 4.8" stroke="#0E4C5C" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkle accents -->
  <circle cx="48" cy="50" r="2.6" fill="#FDE68A" opacity="0.95"/>
  <circle cx="14" cy="48" r="1.5" fill="#A78BFA" opacity="0.8"/>
</svg>