<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LernHub – Fach</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-fach">
  <header class="topbar">
    <a href="/dashboard.html" class="brand">← LernHub</a>
    <div class="topbar-right">
      <span id="welcome"></span>
      <button id="logout" class="btn-ghost">Abmelden</button>
    </div>
  </header>

  <!-- Standard-Fach: Theorie + Quiz -->
  <main class="container" id="main-fach">
    <h1 id="fach-title">Fach</h1>

    <nav class="tabs">
      <button class="tab active" data-tab="theorie">Theorie</button>
      <button class="tab" data-tab="quiz">Quiz</button>
    </nav>

    <section id="tab-theorie" class="tab-panel">
      <div id="theorie"></div>
    </section>

    <section id="tab-quiz" class="tab-panel" hidden>
      <form id="quiz"></form>
      <button id="quiz-submit" class="btn-primary">Auswerten</button>
      <p id="quiz-result" class="quiz-result" hidden></p>
    </section>
  </main>

  <!-- Tool-Modus: Platzhalter für eigenständige Tool-Module (z.B. DSTool) -->
  <main class="container-tool" id="main-tool" hidden>
    <div id="tool-root"></div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    Auth.requireLogin();
    document.getElementById("welcome").textContent = "Hallo, " + Auth.currentUser();
    document.getElementById("logout").addEventListener("click", Auth.logout);

    // Tab-Umschaltung (nur im Standard-Fach-Modus aktiv)
    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.getElementById("tab-theorie").hidden = tab !== "theorie";
        document.getElementById("tab-quiz").hidden = tab !== "quiz";
      });
    });

    const fachId = new URLSearchParams(location.search).get("fach") || "mathe";
    App.renderFach(fachId);
  </script>
</body>
</html>
