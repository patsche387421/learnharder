<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posVarBoxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="posVarBoxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="posVarBoxInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="posVarFlapL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="posVarFlapR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9472F0"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="posVarTag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="82" rx="30" ry="5" fill="#5B21B6" opacity="0.28"/>

  <!-- Box right side -->
  <path d="M48 44 L74 50 L74 73 L48 80 Z" fill="url(#posVarBoxSide)"/>
  <!-- Box front -->
  <path d="M22 50 L48 44 L48 80 L22 73 Z" fill="url(#posVarBoxFront)"/>
  <!-- Inner opening -->
  <path d="M30 41 L48 37 L66 41 L48 46 Z" fill="url(#posVarBoxInner)"/>

  <!-- Open flaps -->
  <path d="M22 50 L48 44 L33 38 L9 43 Z" fill="url(#posVarFlapL)"/>
  <path d="M74 50 L48 44 L63 38 L87 43 Z" fill="url(#posVarFlapR)"/>
  <!-- Flap fold highlights -->
  <path d="M22 50 L48 44 L33 38 Z" fill="#FFFFFF" opacity="0.12"/>
  <path d="M74 50 L48 44 L63 38 Z" fill="#000000" opacity="0.08"/>

  <!-- Front face shine -->
  <path d="M26 51 L34 49.2 L34 73.6 L26 72 Z" fill="#FFFFFF" opacity="0.12"/>

  <!-- Data tag popping out -->
  <g>
    <!-- string/lead -->
    <rect x="46.4" y="20" width="3.2" height="20" rx="1.6" fill="#7C3AED"/>
    <!-- tag body -->
    <path d="M36 14 L57 14 Q60 14 60 17 L60 28 Q60 31 57 31 L43 31 L36 22.5 Z" fill="url(#posVarTag)"/>
    <!-- punch hole -->
    <circle cx="40" cy="22.5" r="2.3" fill="#92400E" opacity="0.65"/>
    <!-- label text -->
    <text x="50" y="26.5" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="11" fill="#5B21B6" text-anchor="middle">x</text>
  </g>

  <!-- Sparkle accents -->
  <circle cx="78" cy="30" r="2" fill="#22D3EE" opacity="0.85"/>
  <circle cx="16" cy="34" r="1.6" fill="#FDE68A" opacity="0.8"/>
  <path d="M82 56 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z" fill="#A78BFA" opacity="0.9"/>
</svg>