<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posStringCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="posStringCardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="posStringQuote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="posStringLetter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="83" rx="29" ry="4.8" fill="#5B21B6" opacity="0.26"/>

  <!-- Card back edge (3D depth) -->
  <rect x="21" y="24" width="54" height="50" rx="11" fill="url(#posStringCardEdge)"/>
  <!-- Card front -->
  <rect x="20" y="20" width="56" height="50" rx="11" fill="url(#posStringCard)"/>
  <!-- Card top shine -->
  <path d="M31 20 L65 20 Q76 20 76 31 L76 36 L20 40 L20 31 Q20 20 31 20 Z" fill="#FFFFFF" opacity="0.12"/>

  <!-- Glowing letter A -->
  <path d="M40 58 L46.5 32 L53.5 32 L60 58 L53.5 58 L52.2 52 L47.8 52 L46.5 58 Z M48.7 46 L51.3 46 L50 39.5 Z"
        fill="url(#posStringLetter)"/>

  <!-- Big magenta quotation marks -->
  <g fill="url(#posStringQuote)">
    <path d="M26 24 q-7 3 -7 11 q0 6 5 6 q4 0 4 -4 q0 -4 -4 -4 q-1 0 -1.6 0.3 q0.6 -4 4.6 -6 Z"/>
    <path d="M76 30 q7 3 7 11 q0 6 -5 6 q-4 0 -4 -4 q0 -4 4 -4 q1 0 1.6 0.3 q-0.6 -4 -4.6 -6 Z" opacity="0.92"/>
  </g>

  <!-- Sparkle accents -->
  <circle cx="82" cy="58" r="2" fill="#22D3EE" opacity="0.85"/>
  <path d="M16 50 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z" fill="#F9A8D4" opacity="0.9"/>
  <circle cx="70" cy="66" r="1.6" fill="#FDE68A" opacity="0.85"/>
</svg>