<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posMethodFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="posMethodEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="posMethodFx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="posMethodGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="84" rx="29" ry="4.8" fill="#5B21B6" opacity="0.26"/>

  <!-- Puzzle/cog block — back edge -->
  <path d="M26 24 h18 a6 6 0 0 1 12 0 h18 v18 a6 6 0 0 1 0 12 v18 h-18 a6 6 0 0 1 -12 0 h-18 v-18 a6 6 0 0 1 0 -12 Z"
        transform="translate(0,4)" fill="url(#posMethodEdge)"/>
  <!-- Puzzle/cog block — front -->
  <path d="M26 24 h18 a6 6 0 0 1 12 0 h18 v18 a6 6 0 0 1 0 12 v18 h-18 a6 6 0 0 1 -12 0 h-18 v-18 a6 6 0 0 1 0 -12 Z"
        fill="url(#posMethodFront)"/>
  <!-- Top shine -->
  <path d="M26 24 h18 a6 6 0 0 1 12 0 h18 v8 h-66 Z" fill="#FFFFFF" opacity="0.13"/>

  <!-- f(x) lettering -->
  <g filter="url(#posMethodGlow)">
    <!-- f -->
    <path d="M44 38 q0 -6 7 -6 q3 0 5 1 l-1.6 5 q-1.4 -0.9 -3 -0.9 q-2.4 0 -2.4 3 l0 1.2 l5 0 l0 5 l-5 0 l0 16 l-6 0 l0 -16 l-3 0 l0 -5 l3 0 Z"
          fill="url(#posMethodFx)"/>
    <!-- ( -->
    <path d="M58 35 q-6 5 -6 16 q0 11 6 16 l3.4 0 q-5.4 -5.6 -5.4 -16 q0 -10.4 5.4 -16 Z" fill="url(#posMethodFx)"/>
    <!-- x -->
    <path d="M62 44 l3.6 0 l2.6 4 l2.6 -4 l3.6 0 l-4.4 6.4 l4.6 6.6 l-3.6 0 l-2.8 -4.2 l-2.8 4.2 l-3.6 0 l4.6 -6.6 Z" fill="#FFFFFF"/>
    <!-- ) -->
    <path d="M75 35 q6 5 6 16 q0 11 -6 16 l-3.4 0 q5.4 -5.6 5.4 -16 q0 -10.4 -5.4 -16 Z" fill="url(#posMethodFx)"/>
  </g>

  <!-- Sparkle accents -->
  <circle cx="22" cy="34" r="1.8" fill="#A5F3FC" opacity="0.85"/>
  <path d="M82 60 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z" fill="#C4B5FD" opacity="0.9"/>
  <circle cx="74" cy="78" r="1.6" fill="#FDE68A" opacity="0.85"/>
</svg>