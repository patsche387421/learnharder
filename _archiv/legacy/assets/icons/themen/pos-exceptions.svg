<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posExcShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="posExcShieldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="posExcBug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="posExcGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="85" rx="25" ry="4.4" fill="#5B21B6" opacity="0.26"/>

  <!-- Shield back edge -->
  <path d="M48 13 L74 21 L74 47 Q74 67 48 81 Q22 67 22 47 L22 21 Z"
        transform="translate(0,3)" fill="url(#posExcShieldEdge)"/>
  <!-- Shield front -->
  <path d="M48 12 L74 20 L74 46 Q74 66 48 80 Q22 66 22 46 L22 20 Z" fill="url(#posExcShield)"/>
  <!-- Shield shine -->
  <path d="M48 12 L74 20 L74 46 Q74 56 62 65 Q48 50 48 12 Z" fill="#FFFFFF" opacity="0.12"/>
  <!-- Inner border -->
  <path d="M48 17 L69 23.5 L69 46 Q69 62 48 74 Q27 62 27 46 L27 23.5 Z" fill="none" stroke="#C4B5FD" stroke-width="1.4" opacity="0.4"/>

  <!-- Caught bug -->
  <g filter="url(#posExcGlow)">
    <!-- legs -->
    <g stroke="#F97316" stroke-width="2.4" stroke-linecap="round">
      <path d="M40 40 L31 35 M40 47 L29 47 M40 54 L31 59"/>
      <path d="M56 40 L65 35 M56 47 L67 47 M56 54 L65 59"/>
    </g>
    <!-- antennae -->
    <g stroke="#FDBA74" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M44 33 Q42 27 38 25"/>
      <path d="M52 33 Q54 27 58 25"/>
    </g>
    <!-- body -->
    <ellipse cx="48" cy="48" rx="11" ry="14" fill="url(#posExcBug)"/>
    <!-- head -->
    <circle cx="48" cy="35" r="6" fill="url(#posExcBug)"/>
    <!-- shell split -->
    <line x1="48" y1="36" x2="48" y2="61" stroke="#9A3412" stroke-width="1.6" opacity="0.6"/>
    <circle cx="44" cy="44" r="1.6" fill="#7C2D12" opacity="0.7"/>
    <circle cx="52" cy="50" r="1.6" fill="#7C2D12" opacity="0.7"/>
    <circle cx="45" cy="55" r="1.4" fill="#7C2D12" opacity="0.7"/>
    <!-- eyes -->
    <circle cx="45.5" cy="34" r="1.3" fill="#FFFFFF"/>
    <circle cx="50.5" cy="34" r="1.3" fill="#FFFFFF"/>
  </g>

  <!-- Warning bang badge -->
  <circle cx="70" cy="30" r="9" fill="#F97316"/>
  <circle cx="70" cy="30" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/>
  <rect x="68.4" y="24.5" width="3.2" height="7" rx="1.6" fill="#FFFFFF"/>
  <circle cx="70" cy="34.5" r="1.8" fill="#FFFFFF"/>

  <!-- Sparkle accents -->
  <circle cx="20" cy="34" r="1.7" fill="#22D3EE" opacity="0.85"/>
  <path d="M22 66 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z" fill="#C4B5FD" opacity="0.9"/>
</svg>