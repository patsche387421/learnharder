<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posLoopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="posLoopShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="posLoopHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="84" rx="27" ry="4.5" fill="#5B21B6" opacity="0.26"/>

  <!-- Circular loop arrow body -->
  <path d="M48 22
           A26 26 0 1 1 24.5 37"
        fill="none" stroke="url(#posLoopGrad)" stroke-width="11" stroke-linecap="round"/>
  <!-- Glossy highlight along the ring -->
  <path d="M48 26
           A22 22 0 0 1 68 38"
        fill="none" stroke="url(#posLoopShine)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Arrowhead at the top, pointing into rotation -->
  <path d="M40 14 L58 22 L42 33 Z" fill="url(#posLoopHead)"/>
  <path d="M40 14 L58 22 L49 18 Z" fill="#FFFFFF" opacity="0.18"/>

  <!-- Center repeat spark -->
  <circle cx="48" cy="52" r="5.5" fill="#FDE68A" opacity="0.95"/>
  <circle cx="48" cy="52" r="2.4" fill="#7C3AED"/>

  <!-- Motion sparkles -->
  <circle cx="79" cy="40" r="2" fill="#22D3EE" opacity="0.85"/>
  <circle cx="20" cy="62" r="1.7" fill="#C4B5FD" opacity="0.85"/>
  <path d="M76 64 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z" fill="#A78BFA" opacity="0.9"/>
</svg>