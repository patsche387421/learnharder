<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>learnharder.app</title>
    <!-- Darstellung vor dem ersten Bild setzen (composables/useTheme.js), sonst blitzt kurz das Theme des Geräts auf.
         Kommt später eine Content-Security-Policy, braucht dieses Skript dort seinen Hash. -->
    <script>
      try { var t = localStorage.getItem('lh-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t) } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
